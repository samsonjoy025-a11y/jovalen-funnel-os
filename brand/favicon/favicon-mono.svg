      <rect x="3"    y="2"     width="18" height="4" rx="2"/>
      <rect x="6.5"  y="9"     width="11" height="4" rx="2"/>
      <circle cx="12" cy="18.75" r="2.75"/>
    </g>
  </g>
</svg>
