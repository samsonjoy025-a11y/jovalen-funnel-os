<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="t">
  <title id="t">Jovalen</title>

  <!--
    GEOMETRY — 24x24 grid, everything on a 12-unit centre axis.
      bar widths   20 / 13 / 6   constant 7-unit taper
      bar height   3,  gap 2.5
      terminal dot d=6 — the same width as the final bar, flush to y=24
    The dot is the payload: many inputs in, one result out.
  -->

  <g fill="#b026d3">
    <rect x="2"   y="1.5"  width="20" height="3" rx="0.75"/>
    <rect x="5.5" y="7"    width="13" height="3" rx="0.75"/>
    <rect x="9"   y="12.5" width="6"  height="3" rx="0.75"/>
  </g>

  <circle cx="12" cy="21" r="3" fill="#a855f7"/>
</svg>
