<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="t">
  <title id="t">Jovalen</title>

  <!--
    MONO / REDUCED-DETAIL MARK
    Same geometry, one colour, and no interior holes — so it survives
    embossing, laser engraving, single-colour print, and favicons.
    Inherits colour from the parent, so <img> needs an explicit fill.
  -->

  <g fill="currentColor">
    <rect x="2"   y="1.5"  width="20" height="3" rx="0.75"/>
    <rect x="5.5" y="7"    width="13" height="3" rx="0.75"/>
    <rect x="9"   y="12.5" width="6"  height="3" rx="0.75"/>
    <circle cx="12" cy="21" r="3"/>
  </g>
</svg>
